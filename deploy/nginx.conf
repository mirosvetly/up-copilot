# Upwork Copilot (copilot.hi-agency.ru): Django behind gunicorn on 127.0.0.1:8013.
# HTTPS blocks and the 80 -> 443 redirect are added by certbot.
server {
    listen 80;
    listen [::]:80;
    server_name copilot.hi-agency.ru;
    client_max_body_size 10m;

    access_log /var/log/nginx/copilot.hi-agency.ru.access.log;
    error_log  /var/log/nginx/copilot.hi-agency.ru.error.log;

    location /static/ {
        alias /srv/upcopilot/app/staticfiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8013;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;  # generating a cover letter can take a while
    }
}
