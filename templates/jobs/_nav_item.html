{% load icons %}{% if disabled %}
<span style="display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--dim);cursor:not-allowed;opacity:.55">
  <span style="display:inline-flex;flex:none">{% icon ico 16 "var(--dim)" %}</span>
  <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ label }}</span>
</span>
{% else %}
<a href="{% url href_name %}" style="display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;font-size:13.5px;font-weight:500;background:{% if active %}var(--line2){% else %}transparent{% endif %};color:{% if active %}var(--fg){% else %}var(--muted){% endif %}">
  <span style="display:inline-flex;flex:none">{% icon ico 16 %}</span>
  <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ label }}</span>
</a>
{% endif %}
